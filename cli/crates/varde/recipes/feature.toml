# A feature: a short spec you approve, then built in a loop until its tests
# pass and another model approves, then made simpler the same way.
label = "feature"
description = "A spec you approve, built until its tests pass and a review agrees, then simplified."

[vars.check]
description = "The command that runs the tests; git config varde.check when left out."
default = ""

[[steps]]
id = "spec"
title = "Spec: {{title}}"
profile = "deep"
gate = "approved"
output = "file:SPEC.md"
prompt = """
Write a short spec in SPEC.md for this feature: what it does, what it does
not, the pieces, and how it will be tested. No code yet. End with what you
are unsure of, as questions.

{{context}}"""

[[steps]]
id = "build"
needs = ["spec"]
use = "fix-until-green"
title = "Build: {{title}}"
prompt = """
Build what SPEC.md describes, with tests for it.

{{context}}"""
check = { cmd = "{{check}}", review = true }

[[steps]]
id = "simplify"
needs = ["build"]
title = "Simplify: {{title}}"
profile = "build"
prompt = """
Make the change on this branch simpler without changing what it does:
remove what it does not need, fold what repeats, and match the code around
it. Change no test; the tests must still pass."""
check = { cmd = "{{check}}", review = true }
loop = { max = 2 }
