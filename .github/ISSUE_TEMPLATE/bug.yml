name: Bug report
description: Something in varde or org-varde does not work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The commands or keys, as few as show it.
  - type: textarea
    attributes:
      label: varde doctor
      description: The output of `varde doctor` (paths may be edited out).
      render: text
  - type: input
    attributes:
      label: Versions
      description: "`varde --version`, the agent (Claude Code or pi) and its version, your OS, and Emacs and tmux if they are involved."
    validations:
      required: true
