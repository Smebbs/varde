name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: cli
        env:
          # cc looks for aarch64-linux-musl-gcc, which musl-tools does not
          # ship; on the arm runner musl-gcc is that compiler.
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p varde
      - name: Check the binary runs
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          file cli/target/${{ matrix.target }}/release/varde
          cli/target/${{ matrix.target }}/release/varde --version
      - name: Package
        shell: bash
        run: |
          name=varde-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp cli/target/${{ matrix.target }}/release/varde LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: varde-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A version with a suffix (1.6.0-beta1) is a pre-release: never Latest.
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${pre[@]}" --title "varde ${GITHUB_REF_NAME#v}" --notes-file notes.md varde-*.tar.gz*

  packages:
    name: Homebrew
    needs: release
    # A pre-release leaves the tap on the last release.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # The update is skipped while the secret is unset.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p '*.sha256' -D out
          packaging/render "${GITHUB_REF_NAME#v}" out
      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Smebbs/homebrew-tap" tap
          mkdir -p tap/Formula
          cp out/varde.rb tap/Formula/varde.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/varde.rb
          git diff --cached --quiet || git commit -m "varde ${GITHUB_REF_NAME#v}"
          git push origin HEAD
